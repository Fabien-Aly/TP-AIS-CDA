# ============================================================================
# Configuration Nginx adaptée au VPS (sans nom de domaine ni utilisateur en dur)
# Blocs intégrés dans /etc/nginx/sites-available/portal par install-ai-hub.sh
# ============================================================================

# Zone de rate-limit dans /etc/nginx/conf.d/ai-hub-ratelimit.conf :
limit_req_zone $binary_remote_addr zone=ai_hub_api:10m rate=10r/s;

# ---------- Blocs ajoutés dans le server principal du portail ----------

    # 1. Indicateur "En ligne" pour la carte AI Hub sur le portail
    location = /status/ai-hub {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_connect_timeout 3s;
    }

    # 2. API AI Hub (/api/relay & /api/stats)
    # Authentification gérée par FastAPI : X-API-Token (Extension) OU cookie portal_session (Portail)
    location /api/ {
        limit_req zone=ai_hub_api burst=20 nodelay;

        client_max_body_size 15M;
        client_body_buffer_size 1M;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 3. Smart Redirector & Tracker de Quotas (/go/chatgpt, /go/gemini, /go/claude, /go/mistral)
    location /go/ {
        limit_req zone=ai_hub_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
